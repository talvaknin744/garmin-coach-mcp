services:
  - type: web
    name: garmin-coach-mcp
    runtime: node
    plan: free
    # Resolve impers/koffi's platform-specific native packages on the Render build image.
    buildCommand: corepack enable && corepack prepare pnpm@10.14.0 --activate && pnpm install --frozen-lockfile && pnpm build
    # Start Node directly so cold starts do not download pnpm through Corepack.
    startCommand: node dist/index.js http
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MCP_TRANSPORT
        value: streamable-http
      - key: MCP_BIND_HOST
        value: 0.0.0.0
      - key: MCP_ALLOWED_ORIGINS
        sync: false
      - key: GARMIN_API_BASE_URL
        value: https://connectapi.garmin.com
      - key: GARMIN_EMAIL
        sync: false
      - key: GARMIN_PASSWORD
        sync: false
      - key: MCP_AUTH_TOKEN
        sync: false
